name: Bug report
description: Report reproducible incorrect TinyOffice behavior.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Do not include provider keys, company data, private messages, or unredacted runtime logs.
  - type: textarea
    id: outcome
    attributes:
      label: What happened?
      description: Describe the observed behavior and its user impact.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start TinyOffice with...
        2. Open...
        3. Perform...
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0-alpha.1 or commit SHA
    validations: { required: true }
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Node 22.23.1, Docker Desktop
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Add relevant logs or screenshots after removing secrets and private data.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed credentials, company data, and private messages from this report.
          required: true
