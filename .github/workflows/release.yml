name: Publish production Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: production-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tinyoffice
          POSTGRES_PASSWORD: tinyoffice_dev
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tinyoffice -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/tinyoffice-web-shadcn/package-lock.json
      - name: Require the tag to match package.json
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected" || { echo "Expected tag $expected, received $GITHUB_REF_NAME" >&2; exit 1; }
      - name: Install dependencies
        run: npm run setup:ci
      - name: Verify source and tests
        env:
          TINYOFFICE_TEST_DATABASE_URL: postgresql://tinyoffice:tinyoffice_dev@127.0.0.1:5432/tinyoffice_test?sslmode=disable
          TINYOFFICE_BLANK_TEST_DATABASE_URL: postgresql://tinyoffice:tinyoffice_dev@127.0.0.1:5432/tinyoffice_blank_test?sslmode=disable
        run: |
          npm run check
          npm run check:tinyoffice-web-shadcn:quality
          npm run check:dependency-licenses
          npm run check:open-source
          npm test
      - name: Build immutable production artifact
        run: npm run build:production-release
      - name: Build stable channel manifest
        env:
          TINYOFFICE_RELEASE_DOWNLOAD_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: npm run build:release-manifest
      - name: Smoke packaged production artifact
        env:
          TINYOFFICE_PRODUCTION_SMOKE_ADMIN_DATABASE_URL: postgresql://tinyoffice:tinyoffice_dev@127.0.0.1:5432/postgres?sslmode=disable
        run: npm run smoke:production-release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            .release/tinyoffice-*.tgz \
            .release/tinyoffice-*.tgz.sha256 \
            .release/tinyoffice-stable.json \
            --verify-tag \
            --title "TinyOffice $GITHUB_REF_NAME" \
            --generate-notes
