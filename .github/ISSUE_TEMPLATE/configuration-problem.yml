name: Setup or configuration problem
description: Ask for help with installation, PostgreSQL, runtime models, or local preview setup.
title: "[Setup]: "
labels: [configuration, needs-triage]
body:
  - type: markdown
    attributes:
      value: Never paste API keys, database passwords, OAuth tokens, or unredacted `.env` files.
  - type: dropdown
    id: stage
    attributes:
      label: Where are you blocked?
      options: [npm install, PostgreSQL startup, Database initialization, Web or API startup, Runtime model configuration, First company or employee setup, Other]
    validations: { required: true }
  - type: textarea
    id: commands
    attributes:
      label: Commands and redacted output
      render: shell
    validations: { required: true }
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Node version, npm version, Docker version
    validations: { required: true }
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed all secrets and private company data.
          required: true
