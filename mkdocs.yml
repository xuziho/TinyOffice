site_name: TinyOffice Product Architecture Manual
site_description: Product architecture memory and development map for TinyOffice.
site_url: ""
repo_name: TinyOffice
repo_url: ""

theme:
  name: material
  language: zh
  palette:
    - scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

